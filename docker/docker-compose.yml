# Orchestrated by the root Makefile: `make shell` opens a shell in this
# container, and the build targets (`make vendor`, `make build`, `make test`)
# are run from inside that shell. The Makefile only starts and enters the
# container from the host; it never runs the compilers itself.
# DEV_UID / DEV_GID are read from the environment of whoever invokes `docker
# compose`, defaulting to 1000:1000 when unset. The root Makefile does not set
# them, so an unset shell means the container runs as 1000:1000: keep that in
# sync with the host user or the mounted tree gets files owned by another uid.
name: bytematrix

services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        USER_UID: ${DEV_UID:-1000}
        USER_GID: ${DEV_GID:-1000}
    image: bytematrix-dev:local
    working_dir: /workspace
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    init: true
    stdin_open: true
    tty: true
    # The container stays up between make invocations: commands enter it with
    # `docker compose exec`, so nothing is created or destroyed per target.
    command: sleep infinity
    environment:
      CC: gcc-14
      CXX: g++-14
      TERM: ${TERM:-xterm-256color}
    volumes:
      - ..:/workspace
